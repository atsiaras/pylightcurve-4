# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
    # The dependencies of PyLightcurve, so that autodoc can import it. The package
    # itself is imported from the repository (docs/conf.py adds it to sys.path).
    # Importing pylightcurve downloads its databases (stellar models, filters,
    # catalogue, ephemerides) on first use, so the build takes a few minutes longer.
    - requirements: requirements.txt
